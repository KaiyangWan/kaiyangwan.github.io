<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign seo_title = site.title | append: ' · ' | append: site.tagline %}
{% assign seo_description = page.description | default: site.description | strip_html | strip_newlines %}
{% assign canonical_url = page.url | absolute_url %}
<title>{{ seo_title | escape }}</title>
<meta name="description" content="{{ seo_description | escape }}">
<meta name="author" content="{{ site.author.name | escape }}">
<link rel="canonical" href="{{ canonical_url }}">
<meta property="og:type" content="profile">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ seo_title | escape }}">
<meta property="og:description" content="{{ seo_description | escape }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ seo_title | escape }}">
<meta name="twitter:description" content="{{ seo_description | escape }}">
<meta name="twitter:image" content="{{ site.author.avatar | absolute_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": {{ canonical_url | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": {{ site.url | jsonify }},
    "image": {{ site.author.avatar | absolute_url | jsonify }},
    "jobTitle": "PhD student",
    "affiliation": {
      "@type": "Organization",
      "name": "INSAIT, Sofia, Bulgaria",
      "url": "https://insait.ai/"
    },
    "email": {{ site.author.email | jsonify }},
    "sameAs": [
      {{ site.author.googlescholar | jsonify }},
      "https://github.com/{{ site.author.github }}"
    ]
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<meta name="theme-color" content="#faf8f3">
